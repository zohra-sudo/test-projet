name: Auto PR on Main

on:
  push:
    branches:
      - feature-test
    paths:
      - 'backend/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="review-main-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
          gh pr create --title "Review changes on main" --body "Auto PR for push to main" --base feature-test --head $BRANCH_NAME


