name: Create Pull Request from test to feature-test

on:
  push:
    branches:
      - 'test'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Configurer Git avec le token d'authentification
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # Étape 3 : Créer le Pull Request de 'test' vers 'feature-test'
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Création automatique du Pull Request de test vers feature-test"
          title: "Automatisation PR : Merge de test vers feature-test"
          body: |
            Ce pull request est créé automatiquement par GitHub Actions.
            Il contient les changements de la branche test vers la branche feature-test.
            Vérifiez les modifications avant de fusionner.
          branch: test  # Branche source
          base: feature-test  # Branche cible
          labels: "automatisé, pr"
          token: ${{ secrets.GITHUB_TOKEN }}  # Utiliser le token d'authentification GitHub

